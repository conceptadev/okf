name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-please-${{ github.ref }}

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - name: Require the release bot token
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
        run: |
          if [[ -z "$RELEASE_PLEASE_TOKEN" ]]; then
            echo "::error::Configure the RELEASE_PLEASE_TOKEN Actions secret"
            exit 1
          fi

      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # A repository-scoped bot token is required because the organization
          # disables PR creation by GITHUB_TOKEN. Its PRs and tags also trigger
          # the regular CI and OIDC release workflows.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
